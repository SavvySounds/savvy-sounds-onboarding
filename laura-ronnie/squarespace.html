<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ------------------------------------------------------------------ *
     Everything below is scoped to #lr-page. Nothing here styles a bare
     body, h1, p, input or button, so this can be dropped into a page that
     already has its own design without the two fighting.
   * ------------------------------------------------------------------ */

  #lr-page{
    /* Tokens live on the wrapper rather than :root so they cannot collide
       with a variable of the same name on the host site. */
    --lr-paper:#F3EEE4; --lr-raised:#FDFBF6; --lr-sunken:#EDE6D8; --lr-line:#DFD6C3;
    --lr-ink:#221E17; --lr-ink-2:#4E4839; --lr-on-mark:#FFF9EE;
    --lr-gold:#8E6210; --lr-green:#157A70;
    --lr-lift:0 1px 2px rgba(60,50,30,.05),0 16px 36px -16px rgba(60,50,30,.18);
    --lr-display:'Barlow Condensed','Arial Narrow',sans-serif;
    --lr-text:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --lr-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --lr-r-card:14px; --lr-r-well:10px; --lr-r-ctrl:8px;
    --lr-ease:cubic-bezier(0.16,1,0.3,1);

    /* Break out of whatever the site drops this into and paint the paper
       right across the window. This is the no-script baseline and it is
       correct whenever the column it sits in is centred; the script
       measures the real offset afterwards and corrects it for a cell that
       is not. Height is never set — it comes from the words. */
    position:relative;
    left:50%;
    width:100vw;
    margin-left:-50vw;
    margin-right:-50vw;

    background:var(--lr-paper);
    color:var(--lr-ink);
    font-family:var(--lr-text) !important;
    font-size:16px;
    line-height:1.6;
    text-align:left;
    -webkit-font-smoothing:antialiased;
  }
  #lr-page, #lr-page *, #lr-page *::before, #lr-page *::after{box-sizing:border-box;}

  /* ---------- put the host site's typography back to neutral ---------- */
  #lr-page h1,#lr-page h2,#lr-page h3,#lr-page p,#lr-page ul,#lr-page ol,
  #lr-page li,#lr-page form,#lr-page fieldset,#lr-page legend,#lr-page figure{
    margin:0; padding:0; border:0; background:none; text-align:left;
  }
  #lr-page ul,#lr-page ol{list-style:none;}
  #lr-page fieldset{min-width:0;}
  #lr-page h1,#lr-page h2,#lr-page h3{
    font:inherit; color:inherit; letter-spacing:normal; text-transform:none;
  }
  #lr-page p,#lr-page li,#lr-page span,#lr-page legend,#lr-page label,#lr-page div{
    font-family:inherit; color:inherit; letter-spacing:normal; text-transform:none;
  }
  #lr-page button,#lr-page input,#lr-page textarea{
    font-family:var(--lr-text) !important;
    color:var(--lr-ink) !important;
    font-size:16px; line-height:1.6; margin:0;
    letter-spacing:normal; text-transform:none;
  }
  #lr-page button,#lr-page textarea,
  #lr-page input:not([type=radio]):not([type=checkbox]){
    -webkit-appearance:none; appearance:none; background:none; border:0; border-radius:0;
  }
  #lr-page input[type=radio]{-webkit-appearance:radio; appearance:radio; background:none;}
  #lr-page a{
    color:var(--lr-gold) !important; text-decoration:underline;
    text-decoration-thickness:1px; text-underline-offset:3px;
  }
  #lr-page a:hover{color:var(--lr-ink) !important;}
  #lr-page [hidden]{display:none !important;}
  #lr-page button:focus-visible,#lr-page input:focus-visible,
  #lr-page textarea:focus-visible,#lr-page a:focus-visible,#lr-page audio:focus-visible{
    outline:2px solid var(--lr-green); outline-offset:2px;
  }

  /* ---------- the door ---------- */
  #lr-page .door{max-width:680px; margin:0 auto; padding:96px 20px 72px;}
  #lr-page .brand{
    font-family:var(--lr-display); font-weight:600; font-size:19px; letter-spacing:.09em;
    text-transform:uppercase; margin:0 0 6px; color:var(--lr-ink);
  }
  #lr-page .door-lede{margin:0 0 32px; color:var(--lr-ink-2);}
  #lr-page #lr-door-form{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; max-width:420px;}
  #lr-page #lr-door-form label{
    display:block; font-family:var(--lr-display); font-size:15px; font-weight:600;
    letter-spacing:.09em; text-transform:uppercase; margin-bottom:7px; color:var(--lr-ink);
  }
  #lr-page .field{flex:1 1 200px;}
  #lr-page #lr-pass{
    width:100%; font-family:var(--lr-mono) !important; font-size:16px;
    background:var(--lr-raised); border:1px solid var(--lr-line);
    border-radius:var(--lr-r-well); padding:12px 14px;
  }
  #lr-page #lr-pass:focus{border-color:var(--lr-green);}
  #lr-page #lr-msg{min-height:1.6em; margin:16px 0 0; color:var(--lr-ink); max-width:44ch;}
  #lr-page #lr-msg:empty{margin:0;}

  /* ---------- buttons ---------- */
  #lr-page .btn{
    font-family:var(--lr-text) !important; font-size:15px; font-weight:600;
    border-radius:var(--lr-r-ctrl); padding:12px 24px; cursor:pointer;
    border:1px solid transparent; min-height:44px;
    transition:background .15s var(--lr-ease), color .15s var(--lr-ease), border-color .15s var(--lr-ease);
  }
  #lr-page .btn-primary{
    background:var(--lr-gold) !important; color:var(--lr-on-mark) !important;
    border-color:var(--lr-gold);
  }
  #lr-page .btn-primary:hover{background:var(--lr-ink) !important; border-color:var(--lr-ink);}
  #lr-page .btn-primary[disabled]{opacity:.65; cursor:default;}
  #lr-page .btn-quiet{
    background:none !important; color:var(--lr-ink) !important;
    border-color:var(--lr-line); font-weight:500;
  }
  #lr-page .btn-quiet:hover{border-color:var(--lr-green);}
  #lr-page .btn-quiet.done{
    background:var(--lr-green) !important; border-color:var(--lr-green);
    color:var(--lr-on-mark) !important;
  }

  /* ---------- the page ---------- */
  #lr-page .wrap{max-width:680px; margin:0 auto; padding:0 20px 72px; width:100%;}
  #lr-page .hero{padding:64px 0 8px;}
  #lr-page .eyebrow{
    font-family:var(--lr-display); font-weight:600; font-size:15px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--lr-gold); margin:0 0 14px;
  }
  #lr-page .hero h1{
    font-family:var(--lr-display); font-weight:600; font-size:clamp(44px,11vw,72px);
    line-height:.96; letter-spacing:.01em; text-transform:uppercase; margin:0 0 16px;
    color:var(--lr-ink);
  }
  #lr-page .hero-when{
    font-family:var(--lr-mono); font-size:13.5px; line-height:1.6;
    color:var(--lr-ink-2); margin:0 0 22px;
  }
  #lr-page .hero-lede{font-size:17px; margin:0; max-width:44ch;}

  #lr-page .card{
    background:var(--lr-raised); border:1px solid var(--lr-line);
    border-radius:var(--lr-r-card); padding:28px 26px; margin:22px 0;
    box-shadow:var(--lr-lift); width:100%;
  }
  #lr-page .card h2{
    font-family:var(--lr-display); font-size:24px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; margin:0 0 18px; color:var(--lr-ink);
  }
  #lr-page .lede{color:var(--lr-ink-2); margin:16px 0 0;}
  #lr-page .card > .lede:first-of-type{margin:-6px 0 18px;}

  /* timeline */
  #lr-page .timeline{list-style:none; margin:0; padding:0;}
  #lr-page .timeline li{
    display:flex; gap:16px; padding:15px 0; border-top:1px solid var(--lr-line);
  }
  #lr-page .timeline li:first-child{border-top:none; padding-top:0;}
  #lr-page .t-time{
    font-family:var(--lr-mono); font-size:12.5px; line-height:1.75; margin:0;
    flex:0 0 82px; color:var(--lr-ink); font-variant-numeric:tabular-nums;
  }
  #lr-page .t-body{flex:1 1 auto; min-width:0;}
  #lr-page .t-body p{margin:0;}
  #lr-page .t-name{font-weight:600;}
  #lr-page .t-body p + p{margin-top:5px; color:var(--lr-ink-2);}
  #lr-page .t-note{
    margin-top:10px !important; padding:11px 13px; background:var(--lr-sunken);
    border:1px solid var(--lr-line); border-radius:var(--lr-r-well); font-size:14.5px;
  }

  /* songs */
  #lr-page .songs{display:flex; flex-direction:column;}
  #lr-page .song{padding:16px 0; border-top:1px solid var(--lr-line);}
  #lr-page .song:first-child{border-top:none; padding-top:0;}
  #lr-page .song p{margin:0;}
  #lr-page .s-moment{
    font-family:var(--lr-display); font-size:15px; font-weight:600; letter-spacing:.09em;
    text-transform:uppercase; color:var(--lr-gold); margin-bottom:5px !important;
  }
  #lr-page .s-title{font-size:16.5px;}
  #lr-page .s-tag{
    font-family:var(--lr-mono); font-size:12px; letter-spacing:.03em;
    color:var(--lr-ink-2); white-space:nowrap;
  }
  #lr-page .s-note{margin-top:5px !important; color:var(--lr-ink-2); font-size:15px;}

  #lr-page .player{
    margin-top:13px; padding:13px; background:var(--lr-sunken);
    border:1px solid var(--lr-line); border-radius:var(--lr-r-well);
  }
  #lr-page .p-label{
    font-family:var(--lr-display); font-size:14px; font-weight:600; letter-spacing:.09em;
    text-transform:uppercase; margin-bottom:9px !important; color:var(--lr-ink);
  }
  #lr-page .p-status{font-size:14.5px; color:var(--lr-ink-2);}
  /* the player takes the width of the card, never of the block it was
     pasted into */
  #lr-page .player audio{width:100%; max-width:100%; display:block;}
  #lr-page .player audio[hidden]{display:none !important;}

  /* lists */
  #lr-page .links{list-style:none; margin:0; padding:0;}
  #lr-page .links li + li{margin-top:11px;}
  #lr-page .links a{font-size:16.5px;}
  #lr-page .nope{margin:0; padding:0 0 0 20px; list-style:disc;}
  #lr-page .nope li{margin-bottom:7px;}

  /* form */
  #lr-page .fld{display:block; font-weight:600; font-size:15px; margin:22px 0 8px;}
  #lr-page .fld.sub{font-weight:500; margin-top:14px;}
  #lr-page form > .fld:first-child{margin-top:0;}
  #lr-page input[type=text],#lr-page input[type=url],#lr-page textarea{
    width:100%; max-width:100%;
    background:var(--lr-sunken); border:1px solid var(--lr-line);
    border-radius:var(--lr-r-well); padding:12px 13px;
  }
  #lr-page input:focus,#lr-page textarea:focus{border-color:var(--lr-green);}
  #lr-page input::placeholder,#lr-page textarea::placeholder{color:var(--lr-ink-2); opacity:1;}
  #lr-page textarea{resize:vertical;}
  #lr-page .fld-set{
    border:1px solid var(--lr-line); border-radius:var(--lr-r-well);
    padding:16px 16px 18px; margin:22px 0 0;
  }
  /* These questions are long, so on a phone the legend wraps to two or three
     lines — and a wrapped legend straddles the top border, which then runs
     straight through the words. Floating it drops it inside the box as an
     ordinary block and lets the border close; the rest of the set clears it.
     `clear` rather than `overflow:hidden`, which would crop the focus rings. */
  #lr-page .fld-set legend{
    float:left; width:100%; padding:0; margin:0 0 10px;
    font-weight:600; font-size:15px;
  }
  #lr-page .fld-set > *:not(legend){clear:both;}
  /* A finger, not a mouse: each choice is a 44px-tall row and the whole
     width of it is the label, so tapping the words picks the button. */
  #lr-page .opt{
    display:flex; align-items:center; gap:10px; min-height:44px;
    padding:6px 0; margin-top:2px; cursor:pointer; width:100%;
  }
  #lr-page .opt input{
    margin:0; width:20px; height:20px; flex:none; accent-color:var(--lr-gold);
  }
  #lr-page .actions{display:flex; flex-wrap:wrap; gap:11px; margin-top:28px;}
  #lr-page .say{min-height:1.6em; margin:14px 0 0; color:var(--lr-ink-2);}
  #lr-page .say:empty{margin:0;}

  #lr-page .page-foot{padding:8px 0 0; color:var(--lr-ink-2);}
  #lr-page .page-foot p{margin:0;}

  @media(max-width:520px){
    #lr-page .card{padding:22px 18px;}
    #lr-page .timeline li{flex-direction:column; gap:5px;}
    #lr-page .t-time{flex:none;}
    #lr-page .door{padding:64px 20px 56px;}
  }

  #lr-page .fade{animation:lr-fade .5s var(--lr-ease) both;}
  @keyframes lr-fade{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media(prefers-reduced-motion:reduce){
    #lr-page *,#lr-page *::before,#lr-page *::after{
      animation:none !important; transition:none !important;
    }
  }
</style>
<div id="lr-page">
  <div id="lr-door" class="door">
    <p class="brand">Savvy Sounds</p>
    <p class="door-lede">A page for the two of you.</p>
    <form id="lr-door-form" novalidate>
      <div class="field">
        <label for="lr-pass">Passcode</label>
        <input id="lr-pass" name="lr-pass" type="password" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               aria-describedby="lr-msg" />
      </div>
      <button type="submit" id="lr-open" class="btn btn-primary">Open</button>
    </form>
    <p id="lr-msg" role="alert"></p>
  </div>
  <div id="lr-body" class="wrap" hidden></div>
</div>
<script>
/*
  The door, browser side. Same lock as the Conduit's members' area:
  OpenSSL's salted format, PBKDF2-HMAC-SHA256 100000 rounds, AES-256-CBC.
  Browser natives only — no library, nothing loaded from anywhere else.

  Written to survive being pasted into somebody else's page: it takes no
  globals, waits for the document properly rather than assuming it is last,
  looks everything up inside its own wrapper, and does nothing at all if the
  wrapper is not there.

  WebCrypto only exists in a secure context: https, or localhost. Opened as
  a file:// this page cannot unlock anything. See VERIFY.md.
*/
(function () {
  "use strict";

  var MAGIC = "Salted__";
  var ITERATIONS = 100000;
  var BASE = "https://savvysounds.github.io/savvy-sounds-onboarding/laura-ronnie/";
  var MAILTO = "hello@savvysoundscollective.com";
  var SUBJECT = "Laura & Ronnie — answers";

  var rootEl, doorEl, bodyEl, formEl, passEl, btnEl, msgEl;

  // One state, three values. The Open button is guarded by this and not by
  // a timer: two fast presses, and the second one finds "working" and stops.
  var state = "idle"; // idle | working | open

  function gone(what) {
    var e = new Error(what);
    e.gone = true;
    return e;
  }

  function bytesFromBase64(b64) {
    var clean = String(b64).replace(/\s+/g, "");
    var binary = atob(clean);
    var out = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
    return out;
  }

  /* OpenSSL's salted blob + passcode -> the bytes that went in. Throws on
     a wrong passcode (the padding fails) and on anything not that shape. */
  async function decryptBlob(blob, passcode) {
    if (blob.length < 16) throw new Error("not the right shape");
    if (new TextDecoder().decode(blob.slice(0, 8)) !== MAGIC) {
      throw new Error("not the right shape");
    }
    var salt = blob.slice(8, 16);
    var ciphertext = blob.slice(16);

    var passKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(passcode), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
      passKey, 48 * 8);
    var derived = new Uint8Array(bits);
    var key = await crypto.subtle.importKey(
      "raw", derived.slice(0, 32), "AES-CBC", false, ["decrypt"]);

    return crypto.subtle.decrypt(
      { name: "AES-CBC", iv: derived.slice(32, 48) }, key, ciphertext);
  }

  async function grab(url) {
    var r;
    try {
      r = await fetch(url, { cache: "no-store" });
    } catch (e) {
      throw gone("could not reach " + url);
    }
    if (!r.ok) throw gone(url + " is not there");
    return r;
  }

  /* The page body: base64 on the wire, text at the end. `fatal` on the
     decoder closes the last gap — roughly one wrong passcode in 256 has
     padding that happens to check out, and its bytes are not UTF-8. */
  async function unlockText(url, passcode) {
    var b64 = await (await grab(url)).text();
    var plain = await decryptBlob(bytesFromBase64(b64), passcode);
    return new TextDecoder("utf-8", { fatal: true }).decode(plain);
  }

  /* The songs: raw binary on the wire, 3.8 MB and 4.3 MB of it. */
  async function unlockBytes(url, passcode) {
    var buf = await (await grab(url)).arrayBuffer();
    return decryptBlob(new Uint8Array(buf), passcode);
  }

  function remember(passcode) {
    try { sessionStorage.setItem("lr-pass", passcode); } catch (e) { /* private window */ }
  }
  function remembered() {
    try { return sessionStorage.getItem("lr-pass") || ""; } catch (e) { return ""; }
  }
  function forget() {
    try { sessionStorage.removeItem("lr-pass"); } catch (e) { /* nothing to do */ }
  }

  // ------------------------------------------------------------------ //
  // Filling the window.
  // ------------------------------------------------------------------ //

  /* The stylesheet already pulls the wrapper out to the full window, which
     is right whenever the column it was pasted into is centred. A page
     builder can just as easily drop it in a narrow cell over on the left,
     and then a fixed -50vw pulls it to the wrong place — so measure where
     the cell actually put us and take exactly that much back.

     `clientWidth` and not `100vw` on purpose: it leaves out the scrollbar,
     so the page cannot end up scrolling sideways by its width. */
  function fillWindow() {
    if (!rootEl) return;
    var s = rootEl.style;
    s.left = "0px";
    s.marginLeft = "0px";
    s.marginRight = "0px";
    s.width = "auto";
    var offset = rootEl.getBoundingClientRect().left;
    s.marginLeft = (-offset) + "px";
    s.width = document.documentElement.clientWidth + "px";
  }

  var refit = null;
  function fillWindowSoon() {
    clearTimeout(refit);
    refit = setTimeout(fillWindow, 120);
  }

  // ------------------------------------------------------------------ //
  // Opening.
  // ------------------------------------------------------------------ //

  async function open(passcode, quiet) {
    if (state !== "idle") return;
    if (!passcode) {
      msgEl.textContent = "Type the passcode Miles sent you.";
      passEl.focus();
      return;
    }
    state = "working";
    btnEl.disabled = true;
    if (!quiet) msgEl.textContent = "Opening…";

    var html = null, used = passcode, failure = null;
    var lower = passcode.toLowerCase();

    try {
      html = await unlockText(BASE + "locked/page.enc", passcode);
    } catch (e) {
      failure = e;
      /* A phone keyboard puts a capital on the first letter by reflex, so
         "Sunset" turns up for "sunset" and the couple get told their own
         passcode is wrong. Try it once in lower case before saying so.
         Not retried when the file could not be fetched at all — that is a
         different problem and a second go would not help. */
      if (!e.gone && lower !== passcode) {
        try {
          html = await unlockText(BASE + "locked/page.enc", lower);
          used = lower;
          failure = null;
        } catch (e2) {
          failure = e2;
        }
      }
    }

    if (failure) {
      state = "idle";
      btnEl.disabled = false;
      forget();
      msgEl.textContent = failure.gone
        ? "This page won't open — tell Miles."
        : "That's not it — check the passcode Miles sent you.";
      passEl.setAttribute("aria-invalid", "true");
      passEl.select();
      passEl.focus();
      return;
    }

    bodyEl.innerHTML = html;
    bodyEl.hidden = false;
    bodyEl.classList.add("fade");
    doorEl.remove();
    state = "open";
    remember(used);

    // A long page can bring on a scrollbar, which changes how wide the
    // window is; measure again now there is something in it.
    fillWindow();

    wireForm();
    // The songs are big; the page is readable long before they land.
    player("entrance", BASE + "locked/laura-entrance.enc", used);
    player("cake", BASE + "locked/cake.enc", used);
  }

  function tryOpen(ev) {
    ev.preventDefault();
    passEl.removeAttribute("aria-invalid");
    open(passEl.value.trim(), false);
  }

  // ------------------------------------------------------------------ //
  // The two players.
  // ------------------------------------------------------------------ //

  /* Ready means the browser has read the song's own header, which is what
     puts a real length on the scrubber. The timer is there so a song that
     never reports still gets its player instead of "Loading" forever. */
  function ready(audio) {
    return new Promise(function (resolve) {
      if (audio.readyState >= 1) return resolve();
      var t = setTimeout(done, 10000);
      function done() {
        clearTimeout(t);
        audio.removeEventListener("loadedmetadata", done);
        audio.removeEventListener("error", done);
        resolve();
      }
      audio.addEventListener("loadedmetadata", done);
      audio.addEventListener("error", done);
    });
  }

  async function player(name, url, passcode) {
    var audio = bodyEl.querySelector("#audio-" + name);
    var status = bodyEl.querySelector("#p-status-" + name);
    if (!audio || !status) return;
    try {
      var buf = await unlockBytes(url, passcode);
      audio.src = URL.createObjectURL(new Blob([buf], { type: "audio/mpeg" }));
      await ready(audio);
      audio.hidden = false;
      status.hidden = true;
    } catch (e) {
      status.textContent = "This one won't play here — tell Miles.";
    }
  }

  // ------------------------------------------------------------------ //
  // The answers.
  // ------------------------------------------------------------------ //

  /* Every question they answered, in the order they appear on the page;
     blanks are left out.

     The wording of each question is read off the page itself — the label
     over a box, the legend over a set of choices — and is never repeated
     in here. Two reasons, and the second is the important one: the
     questions can be reworded in one place, and this file is PUBLIC.
     Everything of the couple's lives inside the locked page; a copy of
     their questions sitting in the door would hand over the very thing
     the lock is for. */
  function answers() {
    var form = bodyEl.querySelector("#answers");
    if (!form) return "";
    var lines = [];
    var done = {};
    var fields = form.querySelectorAll("input, textarea");

    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];

      if (el.type === "radio") {
        if (done[el.name]) continue;      // one line per set of choices
        done[el.name] = true;
        var picked = form.querySelector('input[name="' + el.name + '"]:checked');
        if (!picked) continue;
        var box = el.closest("fieldset");
        var legend = box ? box.querySelector("legend") : null;
        lines.push((legend ? legend.textContent.trim() : el.name)
                   + "\n" + picked.value);
        continue;
      }

      var value = el.value.trim();
      if (!value) continue;
      var label = el.id ? form.querySelector('label[for="' + el.id + '"]') : null;
      lines.push((label ? label.textContent.trim() : (el.name || el.id))
                 + "\n" + value);
    }
    return lines.join("\n\n");
  }

  function mailto(body) {
    return "mailto:" + MAILTO
      + "?subject=" + encodeURIComponent(SUBJECT)
      + "&body=" + encodeURIComponent(body);
  }

  function wireForm() {
    var form = bodyEl.querySelector("#answers");
    var send = bodyEl.querySelector("#send-btn");
    var copy = bodyEl.querySelector("#copy-btn");
    var say = bodyEl.querySelector("#say");
    if (!form || !send || !copy || !say) return;

    // Kept current as they type, so the button always carries exactly what
    // it would send.
    function refresh() { send.dataset.mailto = mailto(answers()); }
    form.addEventListener("input", refresh);
    form.addEventListener("change", refresh);
    refresh();

    send.addEventListener("click", function () {
      var body = answers();
      if (!body) { say.textContent = "Nothing filled in yet."; return; }
      refresh();
      say.textContent = "Opening your mail app…";
      window.location.href = send.dataset.mailto;
    });

    var back = null;
    copy.addEventListener("click", async function () {
      var body = answers();
      if (!body) { say.textContent = "Nothing filled in yet."; return; }
      try {
        await navigator.clipboard.writeText(body);
        copy.textContent = "Copied";
        copy.classList.add("done");
        say.textContent = "";
        clearTimeout(back);
        back = setTimeout(function () {
          copy.textContent = "Copy the answers";
          copy.classList.remove("done");
        }, 3000);
      } catch (e) {
        say.textContent = "Couldn't copy — use Send to Miles instead.";
      }
    });
  }

  // ------------------------------------------------------------------ //
  // Starting up, whenever the host page happens to get here.
  // ------------------------------------------------------------------ //

  function start() {
    rootEl = document.getElementById("lr-page");
    if (!rootEl) return;                       // not our page; do nothing
    doorEl = rootEl.querySelector("#lr-door");
    bodyEl = rootEl.querySelector("#lr-body");
    formEl = rootEl.querySelector("#lr-door-form");
    passEl = rootEl.querySelector("#lr-pass");
    btnEl = rootEl.querySelector("#lr-open");
    msgEl = rootEl.querySelector("#lr-msg");
    if (!doorEl || !bodyEl || !formEl || !passEl || !btnEl || !msgEl) return;

    fillWindow();
    window.addEventListener("resize", fillWindowSoon);
    window.addEventListener("orientationchange", fillWindowSoon);

    /* On a phone the address bar slides away and the window quietly gets
       taller and sometimes wider; Safari reports that here rather than as
       a plain resize. Watching the page element instead does NOT work —
       once this wrapper is a stale width it is what holds the page open,
       so its box stops changing and the reading never corrects itself. */
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fillWindowSoon);
    }

    formEl.addEventListener("submit", tryOpen);

    // The Go key on a phone keyboard, said out loud. Most browsers turn it
    // into a submit on their own, but this page is opened on a phone first
    // and that is the main way in, so it does not get left to chance.
    // `state` still guards it: Go and then Open cannot open the page twice.
    passEl.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") tryOpen(ev);
    });

    // A reload inside the same tab should not ask again.
    var saved = remembered();
    if (saved) open(saved, true);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
